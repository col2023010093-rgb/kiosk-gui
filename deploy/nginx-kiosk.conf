# nginx site for the kiosk: serves the built React app AND proxies the local APIs,
# so no Vite dev server is needed on the Pi.
#
#   sudo apt install -y nginx
#   sudo mkdir -p /var/www/kiosk && sudo cp -r dist/* /var/www/kiosk/
#   sudo cp deploy/nginx-kiosk.conf /etc/nginx/sites-available/kiosk
#   sudo ln -sf /etc/nginx/sites-available/kiosk /etc/nginx/sites-enabled/kiosk
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app is then at  http://localhost/  (open Chromium in kiosk mode on that address).

server {
    listen 80 default_server;
    server_name _;

    root /var/www/kiosk;
    index index.html;

    # React Router: any unknown path returns the app, which then routes client-side.
    location / {
        try_files $uri /index.html;
    }
    # Never cache the entry page, so a redeployed build is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- Local database API (patient health data) -------------------------------------
    # Only the kiosk itself may use this. Without allow/deny, anyone on the same Wi-Fi
    # could read or write records through the proxy.
    location /local-api/ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://127.0.0.1:5003/;     # trailing slash strips "/local-api"
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ---- Sensor servers (same routes as vite.config.ts) -------------------------------
    # Height: separate server on 5002. Delete this block if you merge it into port 5000.
    # Calibration changes how every reading is computed: only the kiosk itself may call it.
    location ~ ^/api/height/calibration {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
    }
    location ~ ^/api/calibration {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }
    location /api/height {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    # Everything else under /api: sensor_server.py on port 5000.
    # Readings take 10-15 s (heart rate 12 s, temperature 10 s), so allow a long wait.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
}
